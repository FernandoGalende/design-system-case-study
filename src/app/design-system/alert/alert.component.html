<div class="alert">
  @if (showIcon()) {
    <span class="icon" aria-hidden="true">
      @if (customIcon()) {
        <ng-content select="[dsAlertIcon]" />
      } @else {
        <svg class="default-icon" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="9" />
          @switch (variant()) {
            @case ('success') {
              <path d="M6.5 10.2l2.4 2.4 4.6-4.8" stroke-linecap="round" stroke-linejoin="round" />
            }
            @case ('warning') {
              <path d="M10 5.5v5.5" stroke-linecap="round" />
              <circle cx="10" cy="14" r="1.1" fill="currentColor" stroke="none" />
            }
            @case ('error') {
              <path d="M10 5.5v5.5" stroke-linecap="round" />
              <circle cx="10" cy="14" r="1.1" fill="currentColor" stroke="none" />
            }
            @default {
              <circle cx="10" cy="6" r="1.1" fill="currentColor" stroke="none" />
              <path d="M10 9v5.5" stroke-linecap="round" />
            }
          }
        </svg>
      }
    </span>
  }

  <div class="content">
    <span class="visually-hidden">{{ variantLabel() }}</span>
    @if (heading()) {
      <p class="heading">{{ heading() }}</p>
    }
    <div class="body"><ng-content /></div>
    @if (action()) {
      <div class="action"><ng-content select="[dsAlertAction]" /></div>
    }
  </div>

  @if (dismissible()) {
    <button type="button" class="dismiss" [attr.aria-label]="dismissLabel()" (click)="dismissed.emit()">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5.5 5.5l9 9m0-9-9 9" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
  }
</div>
